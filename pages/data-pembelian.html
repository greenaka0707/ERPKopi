<div class="page">
  <!-- PAGE HEADER -->
  <div class="page-header">
    <div>
      <h1>Data Pembelian</h1>

      <p>Monitoring transaksi pembelian bahan baku</p>
    </div>
  </div>

  <!-- HISTORY -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px">
      <div>
        <h3>History Pembelian</h3>

        <p style="color: #94a3b8; margin-top: 4px">Monitoring transaksi pembelian</p>
      </div>

      <button class="btn btn-secondary" id="btn-refresh-history">Refresh</button>
    </div>

    <div class="table-wrapper">
      <table class="table">
        <thead>
          <tr>
            <th>No PO</th>

            <th>Tanggal</th>

            <th>Supplier</th>

            <th>Total</th>

            <th>Dibayar</th>

            <th>Sisa</th>

            <th>Status</th>

            <th>Aksi</th>
          </tr>
        </thead>

        <tbody id="history-body">
          <tr>
            <td colspan="8" style="text-align: center; padding: 30px; color: #94a3b8">Belum ada data pembelian</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
